# Optional headless-emulator smoke. Not a pull-request gate.
#
# ci.yml does not call this workflow. Do not mark it as a required status check.
# It boots an AVD, pushes frida-server, and injects enumerate/loaded_classes
# into the bundled Damn Vulnerable Bank APK. That download and boot is heavy.
#
# Hosted ubuntu-latest x86_64 runners expose /dev/kvm for Android emulation
# only after the udev rule below. If KVM is still unavailable the job skips
# with a notice. Run scripts/emulator_up.sh locally in that case.
# https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/

name: Emulator dynamic smoke (optional)

on:
  workflow_dispatch:
    inputs:
      api:
        description: Android API level for the google_apis x86_64 image
        required: false
        default: "34"
        type: string
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    name: Headless dynamic smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM for Android emulation
        id: kvm
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Emulator smoke skipped::/dev/kvm is not on this runner. Use scripts/emulator_up.sh locally. This workflow is optional and does not gate pull requests."
            exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -w /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi
          if [[ -w /dev/kvm ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ls -l /dev/kvm
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Emulator smoke skipped::/dev/kvm is not writable. Use scripts/emulator_up.sh locally. This workflow is optional and does not gate pull requests."
          fi

      - name: Set up JDK 17
        if: steps.kvm.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        if: steps.kvm.outputs.available == 'true'
        uses: android-actions/setup-android@v4

      - name: Install the headless system image
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          API="${{ github.event.inputs.api }}"
          API="${API:-34}"
          if [[ ! "$API" =~ ^[0-9]{2}$ ]]; then
            echo "api must be a two-digit API level" >&2
            exit 2
          fi
          echo "AVD_API=$API" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-${API}" \
            "system-images;android-${API};google_apis;x86_64"

      - name: Set up Python
        if: steps.kvm.outputs.available == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Maya and the pinned Frida 16 client
        if: steps.kvm.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dynamic]"

      - name: Run the headless dynamic smoke against DVBA
        if: steps.kvm.outputs.available == 'true'
        env:
          MAYA_EMULATOR_BOOT_TIMEOUT: "420"
          MAYA_EMULATOR_SMOKE_TIMEOUT: "40"
        run: |
          set -euo pipefail
          # cmdline-tools 22 writes $XDG_CONFIG_HOME/.android/avd when that
          # .android directory exists (XDG_CONFIG_HOME=$HOME/.config here).
          # emulator looks in ANDROID_AVD_HOME, ANDROID_SDK_HOME/avd, and
          # $HOME/.android/avd, and ignores ANDROID_AVD_HOME until it exists.
          # The Python helper creates and exports the same variable locally.
          if [[ -z "${ANDROID_AVD_HOME:-}" ]]; then
            export ANDROID_AVD_HOME="${HOME}/.android/avd"
          fi
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=${ANDROID_AVD_HOME}"
          maya --emulator --package dvba_v1.1.0.apk --avd-api "$AVD_API" --avd-abi x86_64
