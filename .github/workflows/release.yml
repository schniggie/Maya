# Publishes ghcr.io/schniggie/maya and opens a GitHub Release when a vX.Y.Z
# tag is pushed. Merges and pull requests do not run this workflow.
# workflow_dispatch rebuilds an existing tag and does not open a Release.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semver tag to publish (vX.Y.Z). Does not create a GitHub Release."
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: ghcr-schniggie-maya
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag=""
          publish_latest=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            publish_latest=true
          else
            echo "Refusing to publish from event ${EVENT_NAME}." >&2
            exit 1
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Refusing to publish '${tag}'. Expected a semver tag vX.Y.Z with no prerelease suffix." >&2
            exit 1
          fi
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "publish_latest=${publish_latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Record tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/schniggie/maya
          # latest=false so the raw tag below is the only source of :latest.
          # A stable semver pattern would otherwise add :latest on its own,
          # including on workflow_dispatch.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.version.outputs.publish_latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/schniggie/Maya
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Show image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: printf '%s\n' "$IMAGE_TAGS"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile.sandbox
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
